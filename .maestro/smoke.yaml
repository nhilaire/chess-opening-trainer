appId: ${APP_ID}
name: Smoke (any phone language) - first launch with the API offline shows the embedded seed, discover a random line, stop, summary
tags:
  - smoke
---
- runScript:
    file: scripts/mock.js
    env:
      MOCK_ACTION: scenario
      MOCK_BODY: '{"name": "empty"}'
- runScript:
    file: scripts/mock.js
    env:
      MOCK_ACTION: offline
      MOCK_BODY: '{"on": true}'
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible:
    id: "home-opening-ouvertures-en-d4"
- assertVisible:
    id: "home-opening-defense-scandinave"
- assertVisible:
    id: "home-opening-ouvertures-d4-noirs"
- assertNotVisible: "Votre vie privée|Your privacy"
# 11 + 12 + 14 lines of the embedded seed, all offered at once
- assertVisible: "Réviser \\(37 lignes\\)|Review \\(37 lines\\)"
- extendedWaitUntil:
    visible:
      id: "home-status-offline"
    timeout: 60000
- assertVisible: "Mise à jour impossible.*|Could not update.*"
- takeScreenshot: readme-1-home
- tapOn:
    id: "home-review"
- extendedWaitUntil:
    visible:
      id: "training-screen"
    timeout: 10000
- assertVisible: "Regarde et rejoue|Watch and replay"
- assertVisible: "Ligne 1 / 37|Line 1 / 37"
# The order is random: any line shows its arrow (after White's first move when the line is played with Black)
- extendedWaitUntil:
    visible:
      id: "arrow-.*"
    timeout: 5000
- takeScreenshot: readme-2-discovery
- tapOn:
    id: "train-stop"
- extendedWaitUntil:
    visible:
      id: "summary-screen"
    timeout: 5000
- assertVisible: "Séance terminée|Session complete"
- takeScreenshot: 03-summary
- tapOn:
    id: "summary-home"
- assertVisible:
    id: "home-screen"
