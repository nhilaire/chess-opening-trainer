appId: io.github.nhilaire.chessopeningtrainer
name: Smoke (any phone language) - first launch on home with every line offered, discover a random line, stop, summary
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible:
    id: "home-opening-embedded-d4"
- assertVisible:
    id: "home-opening-embedded-scandinavian"
- assertVisible:
    id: "home-opening-embedded-d4Black"
- assertNotVisible: "Votre vie privée|Your privacy"
# 11 + 11 + 14 lines of the embedded openings, all offered from the first launch (no daily limit)
- assertVisible: "Réviser \\(36 lignes\\)|Review \\(36 lines\\)"
- takeScreenshot: readme-1-home
- tapOn:
    id: "home-review"
- extendedWaitUntil:
    visible:
      id: "training-screen"
    timeout: 10000
- assertVisible: "Regarde et rejoue|Watch and replay"
- assertVisible: "Ligne 1 / 36|Line 1 / 36"
# The order is random: any line shows its arrow (after White's first move when the line is played with Black)
- extendedWaitUntil:
    visible:
      id: "arrow-.*"
    timeout: 5000
- takeScreenshot: readme-2-discovery
- tapOn:
    id: "train-stop"
- extendedWaitUntil:
    visible:
      id: "summary-screen"
    timeout: 5000
- assertVisible: "Séance terminée|Session complete"
- takeScreenshot: 03-summary
- tapOn:
    id: "summary-home"
- assertVisible:
    id: "home-screen"
