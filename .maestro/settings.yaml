appId: ${APP_ID}
name: Settings and About - sounds and vibrations off survive a restart, About shows the story and credits
tags:
  - settings
---
- runScript:
    file: scripts/mock.js
    env:
      MOCK_ACTION: scenario
      MOCK_BODY: '{"name": "empty"}'
- runScript:
    file: scripts/mock.js
    env:
      MOCK_ACTION: offline
      MOCK_BODY: '{"on": true}'
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- tapOn:
    id: "home-settings"
- assertVisible:
    id: "settings-sound"
    checked: true
- tapOn:
    id: "settings-sound"
- tapOn:
    id: "settings-vibration"
- assertVisible:
    id: "settings-sound"
    checked: false
- assertVisible:
    id: "settings-vibration"
    checked: false
- takeScreenshot: 40-settings
- stopApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- tapOn:
    id: "home-settings"
- assertVisible:
    id: "settings-sound"
    checked: false
- assertVisible:
    id: "settings-vibration"
    checked: false
- tapOn:
    id: "settings-about"
- assertVisible:
    id: "about-screen"
- assertVisible: ".*(s'envolaient|slipped away).*"
- assertVisible: ".*(développeur indépendant passionné|passionate independent developer).*"
- assertVisible: ".*cburnett.*"
- assertVisible: "Version [0-9]+[.][0-9]+[.][0-9]+"
- takeScreenshot: 41-about
