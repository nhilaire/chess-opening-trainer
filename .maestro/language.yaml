appId: ${APP_ID}
name: Language - switch from the settings, the whole UI follows at once and the choice survives a restart
tags:
  - language
---
# API offline: the embedded seed (names follow the UI language)
- runScript:
    file: scripts/mock.js
    env:
      MOCK_ACTION: scenario
      MOCK_BODY: '{"name": "empty"}'
- runScript:
    file: scripts/mock.js
    env:
      MOCK_ACTION: offline
      MOCK_BODY: '{"on": true}'
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- tapOn:
    id: "home-settings"
- tapOn:
    id: "settings-language-fr"
- assertVisible: "Réglages"
- takeScreenshot: language-fr-settings
- tapOn:
    id: "settings-language-en"
- assertVisible: "Settings"
- takeScreenshot: language-en-settings
- tapOn:
    id: "settings-back"
- assertVisible: "Review \\([0-9]+ lines\\)"
- assertVisible: "Scandinavian Defence"
- takeScreenshot: language-en-home
- stopApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible: "Review \\([0-9]+ lines\\)"
- tapOn:
    id: "home-settings"
- tapOn:
    id: "settings-language-auto"
- tapOn:
    id: "settings-language-fr"
- tapOn:
    id: "settings-back"
- assertVisible: "Réviser \\([0-9]+ lignes\\)"
- assertVisible: "Défense Scandinave"
