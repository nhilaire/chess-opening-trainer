appId: io.github.nhilaire.chessopeningtrainer
name: Train - discover a short line, progress survives a restart, wrong moves twice then the arrow, stop
tags:
  - train
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
# A short White line: 1. d4 d5 2. c4 e6
- tapOn:
    id: "home-add"
- tapOn:
    id: "import-pgn"
- inputText: "1. d4 d5 2. c4 e6 *"
- tapOn:
    id: "import-name"
- inputText: "Court"
- pressKey: Enter
- tapOn:
    id: "import-color-white"
- tapOn:
    id: "import-submit"
- extendedWaitUntil:
    visible: "Court"
    timeout: 5000
- tapOn: "Court"
- tapOn:
    id: "detail-train"
# Discovery: arrows; a move other than the arrow is refused
- extendedWaitUntil:
    visible:
      id: "arrow-d2-d4"
    timeout: 10000
- tapOn:
    id: "sq-e2"
- tapOn:
    id: "sq-e4"
- assertVisible: "Joue le coup indiqué|Play the move shown"
- tapOn:
    id: "sq-d2"
- tapOn:
    id: "sq-d4"
- extendedWaitUntil:
    visible:
      id: "arrow-c2-c4"
    timeout: 5000
- tapOn:
    id: "sq-c2"
- tapOn:
    id: "sq-c4"
- extendedWaitUntil:
    visible: "Ligne apprise|Line learnt"
    timeout: 5000
- takeScreenshot: 30-line-learnt
- tapOn:
    id: "train-next"
- assertVisible: ".*(1 nouvelle apprise|1 new learnt)"
- tapOn:
    id: "summary-home"
# Progress survives a restart
- stopApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible: "(Blancs|White) · 0 (maîtrisée|mastered) · 0 (à revoir|to review) · 0 (nouvelle|new)"
# Killing the app mid-line (two wrong moves already played) leaves the line unchanged (AC-28)
- tapOn: "Court"
- tapOn:
    id: "detail-train"
- extendedWaitUntil:
    visible: "À toi de jouer|Your move"
    timeout: 10000
- tapOn:
    id: "sq-e2"
- tapOn:
    id: "sq-e4"
- tapOn:
    id: "sq-g1"
- tapOn:
    id: "sq-f3"
- assertVisible: "Voici le bon coup|Here is the right move"
- stopApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible: "(Blancs|White) · 0 (maîtrisée|mastered) · 0 (à revoir|to review) · 0 (nouvelle|new)"
# Nothing due yet: training this opening reviews its learnt line anyway
- tapOn: "Court"
- tapOn:
    id: "detail-train"
- extendedWaitUntil:
    visible: "À toi de jouer|Your move"
    timeout: 10000
- tapOn:
    id: "sq-e2"
- tapOn:
    id: "sq-e4"
- assertVisible: "Pas ce coup-là, réessaie|Not that move, try again"
- tapOn:
    id: "sq-g1"
- tapOn:
    id: "sq-f3"
- assertVisible: "Voici le bon coup|Here is the right move"
- assertVisible:
    id: "arrow-d2-d4"
- takeScreenshot: readme-3-answer
- tapOn:
    id: "sq-d2"
- tapOn:
    id: "sq-d4"
- extendedWaitUntil:
    visible:
      id: "piece-d5-bp"
    timeout: 5000
- tapOn:
    id: "sq-c2"
- tapOn:
    id: "sq-c4"
- extendedWaitUntil:
    visible: "Ligne à revoir|Line to review"
    timeout: 5000
- takeScreenshot: 31-line-to-review
# The failed line comes back once; « Arrêter » mid-line opens the summary
- tapOn:
    id: "train-next"
- extendedWaitUntil:
    visible: "À toi de jouer|Your move"
    timeout: 5000
- tapOn:
    id: "train-stop"
- extendedWaitUntil:
    visible:
      id: "summary-screen"
    timeout: 5000
- assertVisible: "0 réussie · 1 à revoir · 0 nouvelle apprise|0 succeeded · 1 to review · 0 new learnt"
- takeScreenshot: 32-summary
