appId: io.github.nhilaire.chessopeningtrainer
name: Import - an invalid PGN shows its error and saves nothing, a valid one appears on home with its colour
tags:
  - import
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- tapOn:
    id: "home-add"
- assertVisible:
    id: "import-screen"
- tapOn:
    id: "import-pgn"
- inputText: "1. e4 e5 2. Ke3 *"
- tapOn:
    id: "import-name"
- inputText: "Faux"
- pressKey: Enter
- tapOn:
    id: "import-color-white"
- tapOn:
    id: "import-submit"
- assertVisible:
    id: "import-error"
- assertVisible: "Coup illégal.*2.Ke3|Illegal move.*2.Ke3"
- takeScreenshot: 10-import-error
- tapOn:
    id: "import-pgn"
- eraseText: 40
- inputText: "1. e4 c5 2. Nf3 d6 3. d4 cxd4 *"
- tapOn:
    id: "import-name"
- eraseText: 10
- inputText: "Sicilienne"
- pressKey: Enter
- tapOn:
    id: "import-color-black"
- takeScreenshot: 11-import-filled
- tapOn:
    id: "import-submit"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 5000
- assertVisible: "Sicilienne"
- assertVisible: "(Noirs|Black) · 0 .*"
- assertNotVisible: "Faux"
- takeScreenshot: 12-import-home
